<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/usuarios.css}" />
    <title>Editar Estudiante</title>
  </head>

  <body>
    <main class="form-container">
      <h1>Editar Estudiante</h1>

      <form
        th:action="@{/estudiante/actualizar}"
        th:object="${student}"
        method="post"
      >

        <!-- ID oculto -->
        <input type="hidden" th:field="*{studentId}" />

        <!-- NOMBRES -->
        <div class="form-group">
          <label>Primer Nombre</label>
          <input type="text" th:field="*{firstName}" required />
        </div>

        <div class="form-group">
          <label>Segundo Nombre</label>
          <input type="text" th:field="*{secondName}" />
        </div>

        <div class="form-group">
          <label>Primer Apellido</label>
          <input type="text" th:field="*{lastName}" required />
        </div>

        <div class="form-group">
          <label>Segundo Apellido</label>
          <input type="text" th:field="*{secondLastName}" required />
        </div>

        <!-- DOCUMENTO -->
        <div class="form-group">
          <label>Tipo Documento</label>
          <input type="text" th:field="*{documentType}" required />
        </div>

        <div class="form-group">
          <label>Número Documento</label>
          <input type="text" th:field="*{documentNumber}" required />
        </div>

        <!-- FECHA -->
        <div class="form-group">
          <label>Fecha Nacimiento</label>
          <input type="date" th:field="*{birthdate}" required />
        </div>

        <!-- CONTACTO -->
        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" th:field="*{phoneNumber}" required />
        </div>

        <div class="form-group">
          <label>Nombre Tutor</label>
          <input type="text" th:field="*{tutorName}" />
        </div>

        <div class="form-group">
          <label>Teléfono Tutor</label>
          <input type="text" th:field="*{tutorPhoneNumber}" />
        </div>

        <div class="form-group">
          <label>Dirección</label>
          <input type="text" th:field="*{direction}" required />
        </div>

        <!-- GRUPO -->
        <div class="form-group">
          <label>Grupo</label>
          <select th:field="*{group}">
            <option value="">Seleccione un grupo</option>

            <option
              th:each="g : ${groups}"
              th:value="${g.groupId}"
              th:text="${g.groupName}"
            ></option>
          </select>
        </div>

        <!-- BOTONES -->
        <div class="form-buttons">
          <button type="submit" class="btn btn-guardar">
            Actualizar Estudiante
          </button>

          <a th:href="@{/usuarios}" class="btn btn-cancelar">
            Cancelar
          </a>
        </div>

      </form>
    </main>
  </body>
</html>
