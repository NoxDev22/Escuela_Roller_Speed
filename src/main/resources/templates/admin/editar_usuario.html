<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">


    <title>Editar Usuario</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>

    </style>

</head>

<body>

<div class="form-container">

    <h1>Editar Usuario</h1>

    <form
            th:action="@{/usuarios/actualizar}"
            th:object="${usuario}"
            method="post">

        <input type="hidden" th:field="*{userId}">
     
    <div class="form-group">   

        <label>Nombre Usuario</label>

        <input
                type="text"
                th:field="*{userName}"
                required>
    </div>             

    <div class="form-group">

        <label>Contraseña</label>

        <input
                type="password"
                th:field="*{userPassword}"
                required>
    </div>
    
    <div class="form-group">

<label>Rol</label>

<select th:field="*{role}">

    <option
        th:each="rol : ${roles}"
        th:value="${rol.rolId}"
        th:text="${rol.rolName}">
    </option>

</select>

    </div>

    <div class="form-group">

      <label>Estado</label>

<select th:field="*{userState}">

    <option th:value="true">
        Activo
    </option>

    <option th:value="false">
        Inactivo
    </option>

</select>

    <div class="form-buttons">

    <button type="submit" class="btn btn-guardar">
        Actualizar Usuario
    </button>

    <a
        th:href="@{/usuarios}"
        class="btn btn-cancelar">

        Cancelar

    </a>

</div>
</div>    

</body>

</html>
