<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/usuarios.css}" />
    <title>Editar Docente</title>
  </head>

  <body>
    <main class="form-container">
      <h1>Editar Docente</h1>

      <form
        th:action="@{/docentes/actualizar}"
        th:object="${teacher}"
        method="post">

        <input type="hidden" th:field="*{teacherId}" />

        <div class="form-group">
          <label>Primer Nombre</label>
          <input type="text" th:field="*{firstName}" required />
        </div>

        <div class="form-group">
          <label>Segundo Nombre</label>
          <input type="text" th:field="*{secondName}" />
        </div>

        <div class="form-group">
          <label>Primer Apellido</label>
          <input type="text" th:field="*{lastName}" required />
        </div>

        <div class="form-group">
          <label>Segundo Apellido</label>
          <input type="text" th:field="*{secondLastName}" required />
        </div>

        <div class="form-group">
          <label>Número Documento</label>
          <input type="text" th:field="*{documentNumber}" required />
        </div>

        <div class="form-group">
          <label>Fecha Nacimiento</label>
          <input type="date" th:field="*{birthdate}" required />
        </div>

        <div class="form-group">
          <label>Correo</label>
          <input type="email" th:field="*{gmail}" required />
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" th:field="*{phoneNumber}" required />
        </div>

        <div class="form-group">
          <label>Título Académico</label>
          <input type="text" th:field="*{academicTitle}" required />
        </div>

        <div class="form-group">
          <label>Dirección</label>
          <input type="text" th:field="*{direction}" required />
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn btn-guardar">
            Actualizar Docente
          </button>

          <a th:href="@{/usuarios}" class="btn btn-cancelar">
            Cancelar
          </a>
        </div>

      </form>
    </main>
  </body>
</html>
