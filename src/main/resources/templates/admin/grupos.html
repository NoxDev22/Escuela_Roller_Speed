<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      th:href="@{./icons/icon_roller_speed.png}"
      type="image/x-icon"
    />
    <link rel="stylesheet" th:href="@{./css/grupos.css}" />
    <link rel="stylesheet" th:href="@{./css/header.css}" />
    <title>Document</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="container groups">
      <section class="groups__header">
        <div class="groups__headerContTitle">
          <h1>Grupos & Asignaciones</h1>
          <p>
            Gestiona los grupos de patinaje, asigna los horarios de clase, el
            entrenador, los alumnos del grupo etc.
          </p>
        </div>
        <div class="groups__headerContInfo">
          <div class="groups__headerInfoTexts">
            <h3
              class="groups__headerInfoTextFTitle"
              th:text="${totalGroups}"
            ></h3>
            <p>Grupos Totales</p>
          </div>
          <div class="groups__headerInfoTexts">
            <h3
              class="groups__headerInfoTextTitle"
              th:text="${totalTeachers}"
            ></h3>
            <p>Entrenadores Activos</p>
          </div>
          <div class="groups__headerInfoTexts">
            <h3
              class="groups__headerInfoTextTitle"
              th:text="${totalStudents}"
            ></h3>
            <p>Estudiantes Activos</p>
          </div>
        </div>
        <a th:href="@{/grupos/agregar}" class="groups__headerBtnAdd">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            viewBox="0 0 24 24"
            class="groups__headerBtnAddIcon"
          >
            <path fill="#EAF1FF" d="M11 13H5v-2h6V5h2v6h6v2h-6v6h-2z" />
          </svg>
          Nuevo Grupo</a
        >
      </section>
      <section class="groups__filters">
        <form action="post" class="groups__filtersForm">
          <div class="groups__formGroup">
            <button class="group__formBtnLevel">Todos los niveles</button>
            <button class="group__formBtnLevel">Profesional</button>
            <button class="group__formBtnLevel">Intermedio</button>
            <button class="group__formBtnLevel">Aprendices</button>
          </div>
          <div class="groups__formGroup">
            <select name="" id="" class="groups__formGroupSelect">
              <option value="0">Filtrar</option>
              <option value="1">+10 Estudiantes</option>
              <option value="2">-10 Estudiantes</option>
              <option value="3">Entrenador</option>
            </select>
            <select
              name=""
              id=""
              class="groups__formGroupSelect groups__formGroupSelectNameCoach"
            >
              <option value="0">Todos lo Nombres</option>
              <option value="1">David Park</option>
              <option value="2">Maria Juana</option>
            </select>
          </div>
        </form>
      </section>
      <section class="groups__containerCards">
        <section class="groups__Slider">
          <article class="groups__card" th:each="group : ${groups}">
            <div
              th:class="'groups__cardHeader ' + (${group.groupLevel} == 'PRO' ? 'cardHeader--pro' : (${group.groupLevel} == 'BEGINNER' ? 'cardHeader--beginner' : ''))"
            >
              <h2 class="groups__cardTitle" th:text="${group.groupName}"></h2>
              <span class="groups__cardLevel">
                <p
                  class="groups__cardLevelTxt"
                  th:text="${group.groupLevel}"
                ></p>
              </span>
            </div>
            <div class="groups__cardBody">
              <div class="groups__cardInfoCoach">
                <img
                  th:src="@{./icons/icon_whistle.svg}"
                  alt="Icono de un pito de entrenador"
                  class="groups__cardIconCoach"
                />
                <span class="groups__cardTextsCoach">
                  <p>Entrenador Asignado</p>
                  <h3
                    th:text="${group.teacher.firstName + ' ' + group.teacher.lastName}"
                  ></h3>
                </span>
              </div>
              <div class="groups__cardSchedules">
                <h3>Horario:</h3>
                <p th:text="${group.schedule.scheduleClass}"></p>
              </div>
              <div class="groups__cardContProgress">
                <div class="groups__cardCapacity">
                  <p>Capacidad:</p>
                  <span class="groups__cardCapacityTexts">
                    <p
                      class="groups__cardCapacityValue"
                      th:text="${group.students.size()}"
                    ></p>
                    /20 Estudiantes</span
                  >
                </div>
                <progress
                  th:value="${group.students.size()}"
                  max="20"
                  class="groups__cardCapacityProgress"
                ></progress>
              </div>
              <div class="groups__cardContList">
                <p>Lista de Estudiantes:</p>
                <div class="groups__cardListStudents">
                  <span th:each="student : ${group.students}">
                    <p
                      th:text="${student.firstName + ' ' + student.lastName}"
                    ></p>
                  </span>
                </div>
              </div>
            </div>
            <div class="groups__cardButtons">
              <a
                th:href="@{/grupos/editar/{groupId}(groupId=${group.groupId})}"
                class="groups__cardBtnEdit"
                >Editar Grupo</a
              >
              <a
                th:href="@{/grupos/eliminar/{groupId}(groupId=${group.groupId})}"
                class="groups__cardSpanDelete"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  class="groups__cardIconDelete"
                >
                  <path
                    fill="#3f465c"
                    d="m9.4 16.5l2.6-2.6l2.6 2.6l1.4-1.4l-2.6-2.6L16 9.9l-1.4-1.4l-2.6 2.6l-2.6-2.6L8 9.9l2.6 2.6L8 15.1zM7 21q-.825 0-1.412-.587T5 19V6H4V4h5V3h6v1h5v2h-1v13q0 .825-.587 1.413T17 21z"
                  />
                </svg>
              </a>
            </div>
          </article>
        </section>
        <div class="Groups__pagination">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="70"
            height="70"
            viewBox="0 0 24 24"
            class="pagination__leftArrow"
          >
            <path
              fill="#001946"
              d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"
            />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="70"
            height="70"
            viewBox="0 0 24 24"
            class="pagination__rightArrow"
          >
            <path
              fill="#001946"
              d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"
            />
          </svg>
        </div>
      </section>
    </main>
  </body>
</html>
