<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Nuevo Usuario</title>
    <link rel="stylesheet" th:href="@{/css/usuarios.css}" />
  </head>
  <body>
    <main class="form-container">
      <h1>Registrar Usuario</h1>
      <form
        th:action="@{/usuarios/guardar}"
        th:object="${usuario}"
        method="post"
      >
        <div class="form-group">
          <label>Nombre Usuario</label>

          <input type="text" th:field="*{userName}" required />
        </div>

        <div class="form-group">
          <label>Contraseña</label>

          <input type="password" th:field="*{userPassword}" required />
          <small>
            La contraseña debe tener entre 4 y 50 caracteres
          </small>
        </div>

        <div class="form-group">
          <label>Rol</label>
          <select th:field="*{role}">
            <option
              th:each="rol : ${roles}"
              th:value="${rol.rolId}"
              th:text="${rol.rolName}"
            ></option>
          </select>
        </div>
          <div class="form-buttons">
            <button type="submit" class="btn btn-guardar">
              Guardar Usuario
            </button>
            <a th:href="@{/usuarios}" class="btn btn-cancelar"> Cancelar </a>
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
